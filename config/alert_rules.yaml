alerts:
  - name: HighLatencyP95
    severity: warning
    condition: "latency_p95 > 3000ms for 5m"
    type: symptom-based
    owner: team-ai-ops
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: "error_rate_pct > 2% for 5m"
    type: symptom-based
    owner: team-ai-ops
    runbook: docs/alerts.md#alert-2
  - name: LowQualityScore
    severity: warning
    condition: "quality_score_mean < 0.75 for 10m"
    type: symptom-based
    owner: team-ai-ops
    runbook: docs/alerts.md#alert-3
